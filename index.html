<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futsal Mini App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/charts/loader.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1a1a1a;
            --accent-color: #ff4500;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }

        /* Шапка турниров */
        .tournaments-tabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid #222;
        }
        .tournaments-tabs::-webkit-scrollbar {
            display: none;
        }
        .tab-btn {
            background-color: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid #333;
            padding: 8px 16px;
            border-radius: 20px;
            white-space: nowrap;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }
        .tab-btn.active {
            background-color: var(--accent-color);
            color: var(--text-color);
            border-color: var(--accent-color);
        }

        /* Главный экран с кнопками */
        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 10px;
        }
        .menu-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid #252525;
            padding: 18px 20px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .menu-btn i {
            color: var(--accent-color);
            font-size: 1.3rem;
            width: 25px;
            text-align: center;
        }
        .menu-btn:active {
            transform: scale(0.98);
            background-color: #222;
        }

        /* Умный баннер MVP */
        .mvp-banner {
            background: linear-gradient(135deg, var(--card-bg) 0%, #252525 100%);
            border-left: 4px solid var(--accent-color);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .mvp-banner h3 {
            margin: 0 0 8px 0;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.1rem;
        }
        .vote-select {
            width: 100%;
            padding: 10px;
            background: #222;
            color: #fff;
            border: 1px solid #444;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 1rem;
        }
        .vote-btn {
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
        }

        /* Кнопка Назад */
        .back-btn {
            background: none;
            border: none;
            color: var(--accent-color);
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            padding: 0;
            margin-bottom: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        /* Элементы контента */
        .section-title {
            font-size: 1.3rem;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .match-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .match-info {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .match-teams {
            font-weight: bold;
            margin-top: 6px;
            font-size: 1.05rem;
        }
        .match-score {
            background: #222;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: bold;
            color: var(--accent-color);
            min-width: 45px;
            text-align: center;
            font-size: 1.1rem;
        }

        .stats-table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .stats-table th, .stats-table td {
            padding: 14px;
            text-align: left;
        }
        /* Задаем ширину: 50% для первой колонки с игроком */
        .stats-table th:first-child, .stats-table td:first-child {
            width: 50%;
        }
        /* Задаем ширину и центровку для колонок голов и пасов */
        .stats-table th:nth-child(2), .stats-table td:nth-child(2),
        .stats-table th:nth-child(3), .stats-table td:nth-child(3) {
            width: 25%;
            text-align: center;
        }
        .stats-table th {
            background-color: #222;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
        }
        .stats-table tr {
            border-bottom: 1px solid #222;
        }
        .stats-table tr:last-child {
            border-bottom: none;
        }
        .player-team {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: block;
            margin-top: 2px;
        }

        .page { display: none; }
        .page.active { display: block; }
        .loader { text-align: center; padding: 30px; color: var(--accent-color); font-weight: bold; }
    </style>
</head>
<body>

    <!-- Вкладки турниров -->
    <div class="tournaments-tabs" id="tournamentsTabs">
        <div class="loader">Загрузка турниров...</div>
    </div>

       <!-- ГЛАВНОЕ МЕНЮ -->
    <div id="page-menu" class="page active">
        <!-- Кликабельный баннер на главном экране -->
        <div class="mvp-banner" id="mvpBlock" onclick="navigateTo('mvp')" style="cursor: pointer; transition: 0.2s;">
            <h3><i class="fa-solid fa-crown"></i> Лучший игрок</h3>
            <div id="mvpContent"><div class="loader" style="padding:0; text-align:left;">Загрузка...</div></div>
        </div>

        <div class="menu-container">
            <button class="menu-btn" onclick="navigateTo('matches')">
                <i class="fa-solid fa-soccer-ball"></i>
                <span>МАТЧИ</span>
            </button>
            <button class="menu-btn" onclick="navigateTo('stats')">
                <i class="fa-solid fa-chart-column"></i>
                <span>СТАТИСТИКА</span>
            </button>
            <button class="menu-btn" onclick="navigateTo('mvp')">
                <i class="fa-solid fa-crown"></i>
                <span>ЛУЧШИЙ ИГРОК</span>
            </button>
        </div>
    </div>
    <!-- МАТЧИ -->
    <div id="page-matches" class="page">
        <button class="back-btn" onclick="navigateTo('menu')"><i class="fa-solid fa-arrow-left"></i> Назад</button>
        <div class="section-title">Расписание и результаты</div>
        <div id="matchesList">
            <div class="loader">Загрузка матчей...</div>
        </div>
    </div>

    <!-- СТАТИСТИКА -->
    <div id="page-stats" class="page">
        <button class="back-btn" onclick="navigateTo('menu')"><i class="fa-solid fa-arrow-left"></i> Назад</button>
        <div class="section-title">Бомбардиры Лиги</div>
        <table class="stats-table">
            <thead>
                <tr>
                    <th>Игрок</th>
                    <th>ГОЛЫ</th>
                    <th>ПАСЫ</th>
                </tr>
            </thead>
            <tbody id="statsList">
                <tr><td colspan="3" class="loader">Загрузка статистики...</td></tr>
            </tbody>
        </table>
    </div>
        <!-- СТРАНИЦА 4: ЛУЧШИЙ ИГРОК (MVP) -->
    <div id="page-mvp" class="page">
        <button class="back-btn" onclick="navigateTo('menu')"><i class="fa-solid fa-arrow-left"></i> Назад</button>
        <div class="section-title" id="mvpPageTitle">Лучший игрок месяца</div>
        <div id="mvpPageContent">
            <div class="loader">Загрузка данных...</div>
        </div>
    </div>
    <script>
        // Вставьте сюда ID вашей опубликованной таблицы вместо текста ниже:
        const SPREADSHEET_ID = '1PqM57MUZ1YapDOn2m05eRI2lOGjXyaC7t8N25kDiawA';
        
        let currentTournamentId = null;
        let dbData = { tournaments: [], matches: [], stats: [], mvp: [] };

        function navigateTo(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(`page-${pageId}`).classList.add('active');
        }

        async function fetchSheetData(sheetName) {
            try {
                const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error("Сбой сети");
                const text = await response.text();
                return parseCSV(text);
            } catch (e) {
                console.error("Ошибка загрузки листа: " + sheetName, e);
                return [];
            }
        }

        function parseCSV(text) {
            const lines = text.split('\n');
            if (lines.length <= 1) return [];
            
            const headers = lines[0].replace(/"/g, '').split(',').map(h => h.trim());
            const result = [];
            
            for (let i = 1; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line) continue;
                
                let currentLine = [];
                let inQuotes = false;
                let currentWord = '';
                
                for (let j = 0; j < line.length; j++) {
                    let char = line[j];
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        currentLine.push(currentWord.trim());
                        currentWord = '';
                    } else {
                        currentWord += char;
                    }
                }
                currentLine.push(currentWord.trim());

                const obj = {};
                headers.forEach((header, index) => {
                    obj[header] = currentLine[index] ? currentLine[index] : '';
                });
                result.push(obj);
            }
            return result;
        }

        async function initApp() {
            if (SPREADSHEET_ID === 'ВАШ_ID_GOOGLE_ТАБЛИЦЫ' || !SPREADSHEET_ID) {
                document.getElementById('tournamentsTabs').innerHTML = '<div class="loader" style="color:red">Ошибка: Вы не указали ID Google Таблицы в коде!</div>';
                return;
            }

            dbData.tournaments = await fetchSheetData('Турниры');
            dbData.matches = await fetchSheetData('Матчи');
            dbData.stats = await fetchSheetData('Статистика');
            dbData.mvp = await fetchSheetData('Лучший_Игрок');

            if (dbData.tournaments.length === 0) {
                document.getElementById('tournamentsTabs').innerHTML = '<div class="loader" style="color:red">Ошибка: Данные не загрузились. Проверьте публикацию таблицы.</div>';
                return;
            }

            renderTournaments();
        }

        function renderTournaments() {
            const container = document.getElementById('tournamentsTabs');
            container.innerHTML = '';

            dbData.tournaments.forEach((t, index) => {
                const btn = document.createElement('button');
                btn.className = `tab-btn ${index === 0 ? 'active' : ''}`;
                btn.innerText = t.Название;
                btn.onclick = () => selectTournament(t.ID, btn);
                container.appendChild(btn);
            });

            if (dbData.tournaments[0]) {
                selectTournament(dbData.tournaments[0].ID);
            }
        }

        function selectTournament(id, btnElement = null) {
            currentTournamentId = id;
            if (btnElement) {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btnElement.classList.add('active');
            }
            renderContent();
        }

        function renderContent() {
            renderMVP();
            renderMatches();
            renderStats();
        }

                                    function renderMVP() {
            const mainMenuContainer = document.getElementById('mvpContent');
            const pageContainer = document.getElementById('mvpPageContent');
            const titleContainer = document.getElementById('mvpPageTitle');
            
            const today = new Date();
            const dayOfMonth = today.getDate(); 
            
            // 🛠 ДЛЯ ТЕСТА ГОЛОСОВАНИЯ: раскомментируй строчку ниже (удали два слэша), если хочешь проверить режим 27-го числа
            // const dayOfMonth = 27; 
            
            // Массивы месяцев в правильном родительском падеже
            const monthsPast = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
            const monthsCurrent = ["январь", "февраль", "март", "апрель", "май", "июнь", "июль", "август", "сентябрь", "октябрь", "ноябрь", "декабрь"];
            
            const currentMonthIdx = today.getMonth(); // от 0 до 11
            // Для прошлого месяца: если сейчас январь (0), то прошлый — декабрь (11)
            const pastMonthIdx = currentMonthIdx === 0 ? 11 : currentMonthIdx - 1;

            const mvpInfo = dbData.mvp.find(m => m.Турнир_ID == currentTournamentId);
            
            if (!mvpInfo) {
                if (mainMenuContainer) mainMenuContainer.innerHTML = 'Данные отсутствуют.';
                if (pageContainer) pageContainer.innerHTML = '<div class="loader">Данные отсутствуют.</div>';
                return;
            }

            const name = mvpInfo.Текущий_Победитель || 'Не определен';
            const team = mvpInfo.Команда_Победителя || mvpInfo.Команда || 'Нет команды';
            const goals = mvpInfo.Голы_Победителя || mvpInfo.Голы || '0';
            const assists = mvpInfo.Пасы_Победителя || mvpInfo.Пасы || '0';

            // === ЛОГИКА ДЛЯ ГОЛОСОВАНИЯ (с 27 числа) ===
            if (dayOfMonth >= 27) {
                const voteTitle = "Голосование за MVP (" + monthsCurrent[currentMonthIdx] + ")";
                
                // 1. Что пишем на баннере главного меню:
                if (mainMenuContainer) {
                    mainMenuContainer.innerHTML = `
                        <div style="font-weight: bold; color: var(--accent-color); font-size: 1.05rem;">
                            <i class="fa-solid fa-circle-dot"></i> ВЫБОР MVP ЗА ${monthsCurrent[currentMonthIdx].toUpperCase()}!
                        </div>
                        <div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">Голосование открыто. Нажми, чтобы сделать выбор</div>
                    `;
                }
                
                // 2. Что показываем на отдельной странице:
                if (pageContainer) {
                    if (titleContainer) titleContainer.innerText = voteTitle;
                    const candidates = mvpInfo.Кандидаты ? mvpInfo.Кандидаты.split(';') : [];
                    if (candidates.length > 0) {
                        let selectHtml = `
                            <div class="match-card" style="flex-direction: column; align-items: flex-start; gap: 15px;">
                                <p style="font-size:1.05rem; margin:0; font-weight:bold; color:var(--accent-color)">
                                    <i class="fa-solid fa-fire"></i> Кандидаты лиги:
                                </p>
                                <select class="vote-select" id="voteSelect" style="margin-bottom:0;">
                        `;
                        candidates.forEach(c => {
                            selectHtml += `<option value="${c.trim()}">${c.trim()}</option>`;
                        });
                        selectHtml += `
                                </select>
                                <button class="vote-btn" onclick="submitVote()">Отдать свой голос</button>
                            </div>
                        `;
                        pageContainer.innerHTML = selectHtml;
                    } else {
                        pageContainer.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted)">Список кандидатов пуст.</div>';
                    }
                }
            } 
            // === ЛОГИКА ДЛЯ ОБЫЧНЫХ ДНЕЙ ===
            else {
                const displayTitle = "Лучший игрок " + monthsPast[pastMonthIdx];
                
                // 1. Что пишем на баннере главного меню:
                if (mainMenuContainer) {
                    mainMenuContainer.innerHTML = `
                        <div style="font-weight: bold; font-size: 1.1rem;">${name}</div>
                        <div style="font-size: 0.8rem; color: var(--text-muted); margin-top:4px;">ФК «${team}» &bull; ${displayTitle}</div>
                    `;
                }
                
                // 2. Что показываем на отдельной странице:
                if (pageContainer) {
                    if (titleContainer) titleContainer.innerText = displayTitle;
                    pageContainer.innerHTML = `
                        <div class="match-card" style="flex-direction: column; padding: 25px 20px; background: linear-gradient(135deg, var(--card-bg) 0%, #222 100%); border-top: 4px solid var(--accent-color); gap: 20px; text-align:center;">
                            <div>
                                <div style="font-size: 2rem; color: var(--accent-color); margin-bottom: 5px;"><i class="fa-solid fa-trophy"></i></div>
                                <div style="font-size: 1.4rem; font-weight: bold; letter-spacing: 0.5px;">${name}</div>
                                <div style="font-size: 0.95rem; color: var(--text-muted); margin-top: 5px;"><i class="fa-solid fa-shirt"></i> ФК «${team}»</div>
                            </div>
                            
                            <div style="display: flex; justify-content: center; gap: 40px; width: 100%; border-top: 1px solid #333; padding-top: 15px; margin-top: 5px;">
                                <div>
                                    <div style="font-size: 1.6rem; font-weight: bold; color: var(--accent-color);">${goals}</div>
                                    <div style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; margin-top: 2px;">Голы</div>
                                </div>
                                <div>
                                    <div style="font-size: 1.6rem; font-weight: bold; color: #fff;">${assists}</div>
                                    <div style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; margin-top: 2px;">Пасы</div>
                                </div>
                            </div>
                        </div>
                    `;
                }
            }
        }
        function submitVote() {
            const selected = document.getElementById('voteSelect').value;
            alert(`Успешно! Вы проголосовали за: ${selected}`);
        }

                function renderMatches() {
            const container = document.getElementById('matchesList');
            container.innerHTML = '';

            const filteredMatches = dbData.matches.filter(m => m.Турнир_ID == currentTournamentId);

            if (filteredMatches.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted)">Нет матчей</div>';
                return;
            }

            filteredMatches.forEach(m => {
                const card = document.createElement('div');
                card.className = 'match-card';
                
                // Проверяем, заполнена ли стадия в таблице
                const stageText = m.Стадия || m.Stadiya || m.stage || '';
                // Если стадия есть, красиво оформляем её рядом со временем
                const stageBadge = stageText ? ` &nbsp;&bull;&nbsp; <span style="color:var(--accent-color); font-weight:bold;">${stageText}</span>` : '';

                card.innerHTML = `
                    <div>
                        <div class="match-info">${m.Дата} &nbsp;&bull;&nbsp; ${m.Время}${stageBadge}</div>
                        <div class="match-teams">${m.Команда1} — ${m.Команда2}</div>
                    </div>
                    <div class="match-score">${m.Счет || 'VS'}</div>
                `;
                container.appendChild(card);
            });
        }

        function renderStats() {
            const container = document.getElementById('statsList');
            container.innerHTML = '';

            const filteredStats = dbData.stats.filter(s => s.Турнир_ID == currentTournamentId);

            if (filteredStats.length === 0) {
                container.innerHTML = '<tr><td colspan="3" style="text-align:center; color:var(--text-muted)">Нет статистики</td></tr>';
                return;
            }

            filteredStats.sort((a, b) => parseInt(b.Голы || 0) - parseInt(a.Голы || 0));

            filteredStats.forEach(s => {
                const tr = document.createElement('tr');
                    tr.innerHTML = `
                    <td>
                        <strong>${s.Игрок || s.Igrok || s.player || ''}</strong>
                        <span class="player-team">${s.Команда || s.Komanda || s.team || ''}</span>
                    </td>
                    <td style="font-weight:bold; color:var(--accent-color)">${s.Голы || s.Goly || s.goals || 0}</td>
                    <td>${s.Пасы || s.Pasy || s.assists || 0}</td>
                `;
                container.appendChild(tr);
            });
        }

        window.onload = initApp;
    </script>
</body>
</html>
